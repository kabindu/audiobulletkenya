<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell on AudioBullet Kenya</title>
<link rel="icon" type="image/jpeg" href="/images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="main-header">
  <div class="container-fluid header-row">
    <a href="/home.html" class="logo">
      <img class="logo-mark" src="/images/logo.jpeg" alt="AudioBullet Kenya logo">
      <div>
        <div class="logo-text">Audio<span>Bullet Kenya</span></div>
        <span class="logo-tag">Audio Equipment Store</span>
      </div>
    </a>
    <a class="pd-back" href="/home.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="pd-back-label">Back to shop</span>
    </a>
  </div>
</header>

<section class="pd-wrap">
  <div class="container acct-container">
    <div id="acctAuth" class="acct-auth">
      <p class="eyebrow">Sell on AudioBullet Kenya</p>
      <div class="acct-tabs">
        <button class="acct-tab active" type="button" data-tab="login">Sign in</button>
        <button class="acct-tab" type="button" data-tab="register">Apply to sell</button>
      </div>

      <form id="loginForm" class="acct-form">
        <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <p class="acct-error" id="loginError"></p>
        <button class="add-btn acct-submit" type="submit">Sign in</button>
      </form>

      <form id="registerForm" class="acct-form" hidden>
        <label class="field"><span>Shop / business name</span><input type="text" name="businessName" required minlength="2" autocomplete="organization" placeholder="e.g. Nairobi Sound Systems"></label>
        <label class="field"><span>Your name</span><input type="text" name="contactName" required minlength="2" autocomplete="name"></label>
        <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="field"><span>Phone number</span><input type="tel" name="phone" required inputmode="tel" autocomplete="tel" pattern="(0|\+?254)[17][0-9]{8}" title="Enter a valid Kenyan phone number, e.g. 07XX XXX XXX" placeholder="07XX XXX XXX"></label>
        <label class="field"><span>Password</span><input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <p class="acct-error" id="registerError"></p>
        <button class="add-btn acct-submit" type="submit">Submit application</button>
      </form>

      <div class="acct-empty" id="registerSuccess" hidden>Application submitted. We&rsquo;ll review your shop and let you know once it&rsquo;s approved &mdash; then you can sign in here and start posting products.</div>
    </div>
  </div>
</section>

<script>
async function request(url, options = {}){
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

document.querySelectorAll('.acct-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.acct-tab').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('loginForm').hidden = btn.dataset.tab !== 'login';
  document.getElementById('registerForm').hidden = btn.dataset.tab !== 'register';
  document.getElementById('registerSuccess').hidden = true;
}));

document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  const data = Object.fromEntries(new FormData(event.target));
  try {
    await request('/api/seller/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    window.location.href = '/seller/index.html';
  } catch(error){ errorEl.textContent = error.message; }
});

document.getElementById('registerForm').addEventListener('submit', async event => {
  event.preventDefault();
  const errorEl = document.getElementById('registerError');
  errorEl.textContent = '';
  const data = Object.fromEntries(new FormData(event.target));
  try {
    await request('/api/seller/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    event.target.hidden = true;
    document.getElementById('registerSuccess').hidden = false;
  } catch(error){ errorEl.textContent = error.message; }
});
</script>
</body>
</html>
