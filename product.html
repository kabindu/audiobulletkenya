<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product &mdash; AudioBullet Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ HEADER (compact — logo, back link, cart) ============ -->
<header class="main-header">
  <div class="container-fluid header-row">
    <a href="home.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="36" height="36" rx="9" stroke="#e0912e" stroke-width="2"/>
        <rect x="10" y="22" width="4" height="10" rx="1.5" fill="#e0912e"/>
        <rect x="18" y="14" width="4" height="18" rx="1.5" fill="#4fb6a6"/>
        <rect x="26" y="9" width="4" height="23" rx="1.5" fill="#e0912e"/>
      </svg>
      <div>
        <div class="logo-text">Audio<span>Bullet Kenya</span></div>
        <span class="logo-tag">Audio Equipment Store</span>
      </div>
    </a>

    <a class="pd-back" href="home.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="pd-back-label">Back to shop</span>
    </a>

    <div class="header-actions">
      <a class="cart-btn" href="home.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
        <span class="cart-label">Cart</span>
      </a>
    </div>
  </div>
</header>

<!-- ============ PRODUCT DETAIL ============ -->
<section class="pd-wrap" id="pdWrap" hidden>
  <div class="container">
    <div class="pd-crumb" id="pdCrumb"></div>
    <div class="pd-grid">
      <div class="pd-gallery">
        <div class="pd-main-media" id="pdMainMedia">
          <button class="pd-nav-arrow left" id="pdPrev" aria-label="Previous image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="pd-nav-arrow right" id="pdNext" aria-label="Next image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="pd-thumbs" id="pdThumbs"></div>
      </div>

      <div class="pd-info">
        <div class="pd-brand" id="pdBrand"></div>
        <h1 class="pd-title" id="pdTitle"></h1>
        <div class="pd-rating" id="pdRating"></div>
        <div class="pd-price-row" id="pdPriceRow"></div>
        <div class="pd-spec mono" id="pdSpec"></div>
        <div class="pd-stock" id="pdStock"></div>

        <div class="pd-qty-row">
          <span>Quantity</span>
          <div class="qty-row">
            <button class="qty-btn" id="pdQtyDec">&minus;</button>
            <span class="qty-num" id="pdQtyNum">1</span>
            <button class="qty-btn" id="pdQtyInc">+</button>
          </div>
        </div>

        <div class="pd-actions">
          <button class="add-btn pd-add-btn" id="pdAddBtn">Add to Cart</button>
          <button class="quote-btn pd-quote-btn" id="pdQuoteBtn">Request Quote</button>
        </div>
        <div class="pd-added-note" id="pdAddedNote" hidden>Added to cart &#10003;</div>

        <div class="pd-trust">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg> Trade assurance</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 30-day returns</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Secured checkout</div>
        </div>
      </div>
    </div>

    <div class="pd-description-block">
      <h2>Product description</h2>
      <div class="pd-description-body" id="pdDescription"></div>
    </div>
  </div>
</section>

<section class="pd-wrap" id="pdNotFound" hidden>
  <div class="container pd-empty">
    <h2>We couldn&rsquo;t find that product</h2>
    <p>It may have sold out or been removed from the catalog.</p>
    <a class="btn btn-primary" href="home.html">&larr; Back to shop</a>
  </div>
</section>

<div class="pd-mobile-bar" id="pdMobileBar" hidden>
  <div class="pd-mobile-price" id="pdMobilePrice"></div>
  <button class="add-btn" id="pdMobileAddBtn">Add to Cart</button>
</div>

  <script src="js/catalog-shared.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
