<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account &mdash; AudioBullet Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="main-header">
  <div class="container-fluid header-row">
    <a href="home.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="36" height="36" rx="9" stroke="#e0912e" stroke-width="2"/>
        <rect x="10" y="22" width="4" height="10" rx="1.5" fill="#e0912e"/>
        <rect x="18" y="14" width="4" height="18" rx="1.5" fill="#4fb6a6"/>
        <rect x="26" y="9" width="4" height="23" rx="1.5" fill="#e0912e"/>
      </svg>
      <div>
        <div class="logo-text">Audio<span>Bullet Kenya</span></div>
        <span class="logo-tag">Audio Equipment Store</span>
      </div>
    </a>
    <a class="pd-back" href="home.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="pd-back-label">Back to shop</span>
    </a>
  </div>
</header>

<section class="pd-wrap">
  <div class="container acct-container">

    <!-- Signed-out: login / register -->
    <div id="acctAuth" class="acct-auth" hidden>
      <div class="acct-tabs">
        <button class="acct-tab active" data-tab="login">Sign in</button>
        <button class="acct-tab" data-tab="register">Create account</button>
      </div>

      <form id="loginForm" class="acct-form">
        <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <p class="acct-error" id="loginError"></p>
        <button class="add-btn acct-submit" type="submit">Sign in</button>
      </form>

      <form id="registerForm" class="acct-form" hidden>
        <label class="field"><span>Full name</span><input type="text" name="name" required autocomplete="name"></label>
        <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="field"><span>Phone (optional)</span><input type="tel" name="phone" autocomplete="tel"></label>
        <label class="field"><span>Password</span><input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <p class="acct-error" id="registerError"></p>
        <button class="add-btn acct-submit" type="submit">Create account</button>
      </form>
    </div>

    <!-- Signed-in: account overview + orders -->
    <div id="acctOverview" class="acct-overview" hidden>
      <div class="acct-header">
        <div>
          <p class="eyebrow">My account</p>
          <h1 id="acctName"></h1>
          <p class="acct-meta" id="acctMeta"></p>
        </div>
        <button class="quote-btn" id="logoutBtn">Sign out</button>
      </div>

      <h2 class="acct-orders-heading">Order history</h2>
      <div id="acctOrders" class="acct-orders"></div>
    </div>

  </div>
</section>

  <script src="js/catalog-shared.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
